[project]
name = "rustic-python"
version = "0.5.2"
description = "A guide to Rust-inspired Python types, with an ML and data science bias"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Vadym Stupakov", email = "vadim.stupakov@gmail.com" }]
dependencies = [
    "pyrefly>=1.3.1",
    "pytest>=8.4",
    "ruff>=0.16.9",
    "more-itertools>=11.1.0",
    "typing-extensions>=4.12",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15",
]

[tool.uv]
package = false
